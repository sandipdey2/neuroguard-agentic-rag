# Type-check config (v2.6.0). Run: mypy
# Pragmatic scope: the harness/gate/receipt/learning core that the safety claims rest on, plus the Gardener.
# Third-party packages without stubs are ignored; the rest of the code is checked by tests + ruff.
[mypy]
python_version = 3.13
files = core/harness.py, core/pipeline.py, core/episodes.py, core/config.py, core/permissions.py, core/confidence.py, core/monitoring.py, scripts/garden.py
ignore_missing_imports = True
follow_imports = silent
check_untyped_defs = False
warn_unused_configs = True
warn_redundant_casts = True
no_implicit_optional = True
strict_equality = True
