# Data & memory layer: PostgreSQL (database: memory, episodes, chat turns, job queue) and Redis (cache).
# For production prefer a managed PostgreSQL / Redis and point DATABASE_URL / REDIS_URL at them.
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: neuroguard}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_DB, value: neuroguard}
            - {name: POSTGRES_USER, value: neuroguard}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: neuroguard-secrets, key: POSTGRES_PASSWORD}}
          ports: [{containerPort: 5432}]
          readinessProbe: {exec: {command: ["pg_isready", "-U", "neuroguard"]}, periodSeconds: 5}
          volumeMounts: [{name: pgdata, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: pgdata}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: neuroguard}
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: neuroguard}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", "", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
          ports: [{containerPort: 6379}]
          readinessProbe: {exec: {command: ["redis-cli", "ping"]}, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: neuroguard}
spec:
  selector: {app: redis}
  ports: [{port: 6379}]
