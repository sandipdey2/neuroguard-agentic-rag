# OPTIONAL on-prem LLM path - NOT applied by default (lives outside the main manifest set) and NOT used in tests or evaluations.
# NeuroGuard's default and only evaluated model is gpt-4o-mini through the Vocareum OpenAI-compatible endpoint.
# To use: kubectl apply -f deploy/k8s/optional/vllm.yaml, then set OPENAI_API_BASE=http://vllm:8000/v1 in the ConfigMap and the
# served model name in harness_contract.json - and re-run the evaluation notebook before relying on it.
apiVersion: apps/v1
kind: Deployment
metadata: {name: vllm, namespace: neuroguard}
spec:
  replicas: 1
  selector: {matchLabels: {app: vllm}}
  template:
    metadata: {labels: {app: vllm}}
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args: ["--model", "meta-llama/Llama-3.1-8B-Instruct", "--enable-auto-tool-choice", "--tool-call-parser", "llama3_json"]
          ports: [{containerPort: 8000}]
          resources:
            limits: {nvidia.com/gpu: 1}
---
apiVersion: v1
kind: Service
metadata: {name: vllm, namespace: neuroguard}
spec:
  selector: {app: vllm}
  ports: [{port: 8000}]
